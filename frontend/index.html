<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Analytics — AI Dashboard</title>
  <meta name="description" content="AI-powered real-time sales analytics dashboard with forecasting and churn prediction." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #020817; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 8px; }

    @keyframes fadeInUp   { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin        { to   { transform: rotate(360deg); } }
    @keyframes pulse-dot   { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(.85); } }
    @keyframes orb1        { 0%,100% { transform:translate(0,0) scale(1); } 40% { transform:translate(60px,-80px) scale(1.15); } 70% { transform:translate(-30px,50px) scale(.9); } }
    @keyframes orb2        { 0%,100% { transform:translate(0,0) scale(1); } 35% { transform:translate(-70px,50px) scale(1.2); } 70% { transform:translate(40px,-40px) scale(.85); } }
    @keyframes orb3        { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(30px,60px) scale(1.1); } }
    @keyframes shimmer-bar { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
